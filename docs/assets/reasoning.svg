  <text x="1074" y="22" text-anchor="end" font-size="10" font-weight="600" fill="#b29ddb" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">fireflyframework-agentic</text>
  <line x1="26" y1="62" x2="1074" y2="62" stroke="#7c3aed" stroke-width="1.4" opacity="0.42"/>
  <text x="26" y="84" font-size="14" fill="#756881" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Four patterns use the base template below; Tree of Thoughts and Goal Decomposition override execute().</text>
<g filter="url(#sh)"><rect x="64" y="113" width="228" height="61" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M64 125a12 12 0 0 1 12 -12h204a12 12 0 0 1 12 12v23H64Z" fill="url(#hdr)"/>
<text x="82" y="137" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">_reason</text>
<line x1="292.0" y1="144.0" x2="310.0" y2="144.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr)"/>
<g filter="url(#sh)"><rect x="312" y="113" width="228" height="61" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M312 125a12 12 0 0 1 12 -12h204a12 12 0 0 1 12 12v23H312Z" fill="url(#hdr)"/>
<text x="330" y="137" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">_act</text>
<line x1="540.0" y1="144.0" x2="558.0" y2="144.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr)"/>
<g filter="url(#sh)"><rect x="560" y="113" width="228" height="61" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M560 125a12 12 0 0 1 12 -12h204a12 12 0 0 1 12 12v23H560Z" fill="url(#hdr)"/>
<text x="578" y="137" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">_observe</text>
<line x1="788.0" y1="144.0" x2="806.0" y2="144.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr)"/>
<g filter="url(#sh)"><rect x="808" y="113" width="228" height="61" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M808 125a12 12 0 0 1 12 -12h204a12 12 0 0 1 12 12v23H808Z" fill="url(#hdr)"/>
<text x="826" y="137" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">_should_continue</text>
<path d="M922 175V207H178V179" fill="none" stroke="#c2722a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arra)"/>
<text x="550" y="242" font-size="15" font-weight="400" fill="#5b21b6" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">Base template: ReAct · Chain of Thought · Plan-and-Execute · Reflexion</text>
<g filter="url(#sh)"><rect x="42" y="278" width="328" height="103" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M42 290a12 12 0 0 1 12 -12h304a12 12 0 0 1 12 12v23H42Z" fill="url(#hdr)"/>
<text x="60" y="302" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">ReAct</text>
<text x="60" y="335" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Think, call a tool, observe</text>
<text x="60" y="358" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Interleaved reasoning and action</text>
<g filter="url(#sh)"><rect x="386" y="278" width="328" height="103" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M386 290a12 12 0 0 1 12 -12h304a12 12 0 0 1 12 12v23H386Z" fill="url(#hdr)"/>
<text x="404" y="302" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Chain of Thought</text>
<text x="404" y="335" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Structured intermediate steps</text>
<text x="404" y="358" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">A final answer from those steps</text>
<g filter="url(#sh)"><rect x="730" y="278" width="328" height="103" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M730 290a12 12 0 0 1 12 -12h304a12 12 0 0 1 12 12v23H730Z" fill="url(#hdr)"/>
<text x="748" y="302" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Plan-and-Execute</text>
<text x="748" y="335" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Create a plan, execute its steps</text>
<text x="748" y="358" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Replan when configured</text>
<g filter="url(#sh)"><rect x="42" y="405" width="328" height="103" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M42 417a12 12 0 0 1 12 -12h304a12 12 0 0 1 12 12v23H42Z" fill="url(#hdr)"/>
<text x="60" y="429" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Reflexion</text>
<text x="60" y="462" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Execute, critique, retry</text>
<text x="60" y="485" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Use feedback on another attempt</text>
<g filter="url(#sh)"><rect x="386" y="405" width="328" height="103" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M386 417a12 12 0 0 1 12 -12h304a12 12 0 0 1 12 12v23H386Z" fill="url(#hdr)"/>
<text x="404" y="429" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Tree of Thoughts</text>
<text x="404" y="462" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Generate and evaluate branches</text>
<text x="404" y="485" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Select the highest-scored branch</text>
<g filter="url(#sh)"><rect x="730" y="405" width="328" height="103" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M730 417a12 12 0 0 1 12 -12h304a12 12 0 0 1 12 12v23H730Z" fill="url(#hdr)"/>
<text x="748" y="429" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Goal Decomposition</text>
<text x="748" y="462" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Split a goal into sub-goals</text>
<text x="748" y="485" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Coordinate their execution</text>
<text x="550" y="552" font-size="14" font-weight="400" fill="#5b21b6" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">All return ReasoningResult with a trace; ReasoningPipeline composes patterns.</text>
</svg>
