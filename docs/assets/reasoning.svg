    <radialGradient id="amb" cx="1040" cy="40" r="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.14"/><stop offset="0.6" stop-color="#6366f1" stop-opacity="0.05"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
