<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="diagram-title diagram-description" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <title id="diagram-title">Six reasoning patterns share result and trace contracts</title><desc id="diagram-description">Six reasoning patterns share result and trace contracts. ReAct, Chain of Thought, Plan-and-Execute, and Reflexion use the AbstractReasoningPattern template: reason, act, observe, and should_continue, with early stopping and iteration limits. Tree of Thoughts overrides execute to generate and score branches; Goal Decomposition overrides execute to coordinate phases and tasks. ReasoningPipeline composes patterns.</desc>
