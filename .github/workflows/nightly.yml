name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  test:
    name: Test (nightly)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: uv sync --extra dev --extra binary --extra vectorstores-sqlite-vec --extra vectorstores-pgvector --extra openai-embeddings
      - run: uv run pytest --cov --cov-report=term-missing --durations=50

  report-failure:
    name: Report failure
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const label = 'nightly-failure';
            const title = 'Nightly run failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Nightly run failed on \`${context.sha.substring(0, 7)}\` (${new Date().toISOString().slice(0, 10)}).`,
              ``,
              `Run: ${runUrl}`,
            ].join('\n');

            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (err) {
              if (err.status !== 404) throw err;
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: 'd73a4a',
                description: 'Tracks failures of the scheduled Nightly workflow',
              });
            }

            const open = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            if (open.data.length > 0) {
              const issue = open.data[0];
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body,
              });
              core.notice(`Commented on existing issue #${issue.number}.`);
            } else {
              const created = await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: [label, 'bug'],
              });
              core.notice(`Created issue #${created.data.number}.`);
            }

  close-issue-on-success:
    name: Close tracking issue on success
    needs: test
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const label = 'nightly-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const open = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: label,
              per_page: 10,
            });

            for (const issue of open.data) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `Nightly run succeeded on \`${context.sha.substring(0, 7)}\`. Closing. Run: ${runUrl}`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
