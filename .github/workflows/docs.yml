name: docs

# Build the MkDocs site and deploy it to GitHub Pages.
#
# One-time manual step (cannot be automated from here):
#   Repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# After that, every push to main that touches the docs rebuilds and deploys to
# https://fireflyframework.github.io/fireflyframework-agentic/

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "assets/**"
      - "scripts/check_docs.py"
      - "overrides/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('docs/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install docs toolchain
        run: pip install -r docs/requirements.txt
      - name: Check generated diagrams
        run: python assets/tools/build_brand_assets.py --check
      - name: Build (strict)
        run: mkdocs build --strict
      - name: Check links and render Mermaid diagrams
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          python scripts/check_docs.py --browser
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
