name: deploy-mcp

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-firefly
  ACR_NAME: fireflysignature
  CONTAINER_APP: firefly-mcp
  IMAGE: fireflysignature.azurecr.io/firefly-mcp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: cda419af-f2d8-444c-9248-4ada4f168c8a
          subscription-id: e8b8063e-f842-4a59-9754-427ddb7bfb63

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Build & push image
        run: |
          docker buildx build \
            --push \
            --platform linux/amd64 \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Update Container App
        run: |
          az containerapp update \
            -g ${{ env.RESOURCE_GROUP }} \
            -n ${{ env.CONTAINER_APP }} \
            --image ${{ env.IMAGE }}:${{ github.sha }}
