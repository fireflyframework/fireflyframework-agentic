name: deploy-mcp

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to deploy"
        required: true
        type: choice
        options: [pre, prod]
        default: pre

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-firefly
  ACR_NAME: fireflysignature
  IMAGE: fireflysignature.azurecr.io/firefly-mcp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve target environment
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target="${{ inputs.target }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            target="prod"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            target="pre"
          else
            echo "Unsupported ref ${{ github.ref }}" >&2
            exit 1
          fi
          if [[ "$target" == "prod" ]]; then
            app="firefly-mcp"
          else
            app="firefly-mcp-pre"
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "Deploying to $target ($app)"

      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build & push image
        run: |
          docker buildx build \
            --push \
            --platform linux/amd64 \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:${{ steps.target.outputs.target }} \
            .

      - name: Update Container App
        run: |
          az containerapp update \
            -g ${{ env.RESOURCE_GROUP }} \
            -n ${{ steps.target.outputs.app }} \
            --image ${{ env.IMAGE }}:${{ github.sha }}
