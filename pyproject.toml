[project]
name = "fireflyframework-agentic"
version = "26.05.21"
description = "A GenAI metaframework built on Pydantic AI for building production-grade GenAI applications with agents, reasoning patterns, prompt engineering, observability, and more."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Firefly Software Foundation" }
]
maintainers = [
    { name = "Firefly Software Foundation" }
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["genai", "agents", "pydantic-ai", "llm", "reasoning", "observability", "framework"]
dependencies = [
    "pydantic-ai>=1.99.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "jinja2>=3.1.0",
    "httpx>=0.28.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "genai-prices>=0.0.1",
    # Promoted from `corpus-search` / `dev` extras: firefly-mcp-http's main()
    # imports python-dotenv at module top to load a project-local .env when
    # run by a developer. Real env vars always win (load_dotenv defaults to
    # override=False), so Azure / Container Apps deploys see no change. The
    # alternative — guarding the import — adds noise the reviewer flagged.
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
rest = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.0.0",
]
kafka = [
    "aiokafka>=0.12.0",
]
rabbitmq = [
    "aio-pika>=9.5.0",
]
redis = [
    "redis>=5.2.0",
]
queues = [
    "fireflyframework-agentic[kafka,rabbitmq,redis]",
]
postgres = [
    "asyncpg>=0.30.0",
    "sqlalchemy>=2.0.0",
]
mongodb = [
    "motor>=3.6.0",
    "pymongo>=4.10.0",
]
security = [
    "pyjwt>=2.10.0",
    "cryptography>=44.0.0",
]
azure = [
    "azure-identity>=1.19",
    "azure-keyvault-secrets>=4.9",
    "msal>=1.31",
    "pyjwt[crypto]>=2.10.0",
    # Azure Monitor / Application Insights OpenTelemetry exporter (Quickpulse
    # Live Metrics + traces / metrics / logs). Lives in the same umbrella as
    # the AAD auth deps so a future "remove all Azure" is a single
    # ``pyproject.toml`` block to delete and a single ``--extra azure`` to drop.
    "azure-monitor-opentelemetry-exporter>=1.0.0b30",
]
mcp = [
    "fastmcp>=3.2",
]
embeddings = [
    "numpy>=1.26.0",
]
openai-embeddings = [
    "openai>=1.0.0",
]
cohere-embeddings = [
    "cohere>=5.0.0",
]
google-embeddings = [
    "google-generativeai>=0.8.0",
]
mistral-embeddings = [
    "mistralai>=1.0.0",
]
markitdown = [
    "markitdown[pdf,docx,pptx,xlsx]>=0.0.1a3",
    "markdown-it-py>=3.0",
]
voyage-embeddings = [
    "voyageai>=0.3.0",
]
azure-embeddings = [
    "openai>=1.0.0",
]
bedrock-embeddings = [
    "boto3>=1.35.0",
]
ollama-embeddings = [
    "httpx>=0.28.0",
]
reasoning-eval = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
]
corpus-search = [
    "fireflyframework-agentic[markitdown,watch,openai-embeddings,vectorstores-sqlite-vec]",
    # sqlglot parses the user-supplied SELECT in the ``corpus_sql`` MCP tool
    # to whitelist table references against the structured-ingestion schema
    # registry (rejecting reads from internal tables like ``chunks`` / ``_schemas``).
    "sqlglot>=26.0.0",
    # AzureBlobBackend (examples/corpus_search/azure_backend.py) is an
    # optional swap-in for remote corpus storage; the example also drives
    # the Container Apps deployment path. Listed alongside the rest of the
    # corpus_search example's runtime stack so a single extra suffices.
    "azure-storage-blob>=12.20.0",
    "azure-identity>=1.19",
]
vectorstores-chroma = [
    "chromadb>=0.5.0",
]
vectorstores-sqlite-vec = [
    "sqlite-vec>=0.1.6",
]
vectorstores-pinecone = [
    "pinecone>=5.0.0",
]
vectorstores-qdrant = [
    "qdrant-client>=1.12.0",
]
watch = ["watchfiles>=0.24.0"]
all = [
    "fireflyframework-agentic[rest,queues,postgres,mongodb,security,azure,http,embeddings,openai-embeddings,cohere-embeddings,google-embeddings,mistral-embeddings,voyage-embeddings,azure-embeddings,bedrock-embeddings,ollama-embeddings,corpus-search,vectorstores-chroma,vectorstores-pinecone,vectorstores-qdrant,vectorstores-sqlite-vec,markitdown,watch]",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-benchmark>=5.0.0",
    "pytest-xdist>=3.6.0",
    "testcontainers>=4.10.0",
    "ruff>=0.9.0",
    "pyright>=1.1.0",
    "httpx>=0.28.0",
    "pdfplumber>=0.11.0",
    "pre-commit>=3.8.0",
]

[project.scripts]
firefly-mcp-http = "fireflyframework_agentic.exposure.mcp.http_cli:main"
# firefly-mcp-token lives with the corpus_search example
# (examples/corpus_search/firefly_mcp_token.py) — invoke it via
# ``python -m examples.corpus_search.firefly_mcp_token …``. It is not
# shipped as a framework script because it depends on the Azure SDK,
# which the framework keeps as a provider-specific optional extra.

[project.urls]
Homepage = "https://fireflyframework.org/"
Documentation = "https://github.com/fireflyframework/fireflyframework-agentic/tree/main/docs"
Repository = "https://github.com/fireflyframework/fireflyframework-agentic"
Issues = "https://github.com/fireflyframework/fireflyframework-agentic/issues"
Changelog = "https://github.com/fireflyframework/fireflyframework-agentic/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.9.5,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TC"]
ignore = ["E501", "TC001", "TC002", "TC003", "UP040", "UP046", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["fireflyframework_agentic"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["fireflyframework_agentic"]
exclude = ["tests/**", "examples/**"]
extraPaths = ["."]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "nightly: runs only in nightly CI. Long-running tests: benchmarks, real LLM/DB/HTTP, or anything not suitable for the PR gate.",
    "integration: runs against the real CorpusAgent / DatabaseStore stack (no external network — embedders / LLM agents are stubbed or mocked).",
]
