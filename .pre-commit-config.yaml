# Pre-commit hooks for fireflyframework-agentic.
#
# Install once per clone (with the firefly venv active):
#   uv sync --extra dev
#   uv run pre-commit install                       # wires commit-stage hooks (ruff, gitleaks, …)
#   uv run pre-commit install --hook-type pre-push  # wires push-stage hooks (pyright, pytest)
#
# The pre-push hooks (pyright, pytest) use `python -m …` via language:system,
# so they resolve against whatever venv is active when you run `git push`.
# Always push with the firefly venv active: source ~/.venvs/firefly/bin/activate
#
# Run manually on the whole repo:
#   uv run pre-commit run --all-files
#   uv run pre-commit run --all-files --hook-stage pre-push
#
# Update hook versions:
#   uv run pre-commit autoupdate

minimum_pre_commit_version: "3.8.0"
fail_fast: false

# Bundled frontend build artifacts — checked in but not source code.
exclude: |
  (?x)^(
    studio-desktop/frontend-dist/.*|
    src/fireflyframework_agentic/studio/static/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml uses Material's `!!python/name:` tags (e.g. the mermaid
        # superfence), which check-yaml can't construct. `mkdocs build --strict`
        # in the docs workflow is its real validator.
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-json
        # tsconfig*.json files use JSONC (comments, trailing commas).
        exclude: ^.*tsconfig.*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-ast
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        language: system
        entry: python -m pyright
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: pytest
        name: pytest
        language: system
        entry: python -m pytest tests/unit/ tests/integration/ -m "not nightly" -q --tb=short
        pass_filenames: false
        stages: [pre-push]
