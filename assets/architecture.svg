  <text x="88" y="219.0" fill="#322b45" font-size="11" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">pipeline · DAG · 9 step types · checkpointer · audit-log · reducers</text>
  <g filter="url(#sh)"><rect x="66" y="241.5" width="726" height="66" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><path d="M66 252.5a11 11 0 0 1 11 -11h704a11 11 0 0 1 11 11v15H66Z" fill="url(#hdr)"/></g>
  <circle cx="86" cy="254.5" r="10.5" fill="#4c1d95"/><text x="86" y="258.1" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">2</text>
  <text x="104" y="259.5" fill="#fff" font-size="13" font-weight="700">Experimentation</text>
  <text x="212" y="259.5" fill="#ede7fb" font-size="10" font-weight="600">(2 modules)</text>
  <text x="88" y="290.5" fill="#322b45" font-size="11" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">experiments · lab   —   optional leaf modules</text>
  <g filter="url(#sh)"><rect x="66" y="313.0" width="726" height="66" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><path d="M66 324.0a11 11 0 0 1 11 -11h704a11 11 0 0 1 11 11v15H66Z" fill="url(#hdr)"/></g>
  <circle cx="86" cy="326.0" r="10.5" fill="#4c1d95"/><text x="86" y="329.6" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">3</text>
  <text x="104" y="331.0" fill="#fff" font-size="13" font-weight="700">Intelligence</text>
  <text x="182" y="331.0" fill="#ede7fb" font-size="10" font-weight="600">(4 modules)</text>
  <text x="88" y="362.0" fill="#322b45" font-size="11" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">reasoning · validation/QoS · observability · explainability</text>
  <g filter="url(#sh)"><rect x="66" y="384.5" width="726" height="66" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><path d="M66 395.5a11 11 0 0 1 11 -11h704a11 11 0 0 1 11 11v15H66Z" fill="url(#hdr)"/></g>
  <circle cx="86" cy="397.5" r="10.5" fill="#4c1d95"/><text x="86" y="401.1" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">4</text>
  <text x="104" y="402.5" fill="#fff" font-size="13" font-weight="700">Agent</text>
  <text x="147" y="402.5" fill="#ede7fb" font-size="10" font-weight="600">(5 modules)</text>
  <text x="88" y="433.5" fill="#322b45" font-size="11" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">agents · tools · prompts · memory · content</text>
  <g filter="url(#sh)"><rect x="66" y="456.0" width="726" height="66" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><path d="M66 467.0a11 11 0 0 1 11 -11h704a11 11 0 0 1 11 11v15H66Z" fill="url(#hdr)"/></g>
  <circle cx="86" cy="469.0" r="10.5" fill="#4c1d95"/><text x="86" y="472.6" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">5</text>
  <text x="104" y="474.0" fill="#fff" font-size="13" font-weight="700">Core</text>
  <text x="140" y="474.0" fill="#ede7fb" font-size="10" font-weight="600">(7 modules)</text>
  <text x="778" y="474.0" text-anchor="end" fill="#e7ddff" font-size="9.5" font-weight="700" letter-spacing="0.06em">BASE LAYER</text>
  <text x="88" y="505.0" fill="#322b45" font-size="11" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">config · protocols · exceptions · plugins · resilience · storage · security</text>
  <rect x="66" y="531.5" width="726" height="46" rx="12" fill="url(#bed)"/>
  <g transform="translate(96,554.5) scale(1.25)"><circle r="11" fill="#f6a821" opacity="0.16"/><circle r="6.5" fill="#ffc24a" opacity="0.30"/><circle r="3.4" fill="url(#dot)"/><circle r="1.5" fill="#fff6e0"/></g>
  <text x="122" y="551.5" font-size="13" font-weight="800" fill="#efe8ff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Pydantic AI engine</text>
  <text x="122" y="567.5" font-size="10.5" fill="#c3b6e6">pydantic-ai · pydantic — the type-safe agent core every layer builds on</text>
  <text x="778" y="558.5" text-anchor="end" font-size="10.5" fill="#a896d6" font-weight="600">Agent · Tool · RunContext</text>
  <text x="92" y="608" font-size="9.5" font-style="italic" fill="#8b82a3">Embeddings (8 providers) · Vector Stores (6 backends) — a cross-cutting RAG capability wired into the Agent &amp; Orchestration layers.</text>
