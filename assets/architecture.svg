  <circle cx="86" cy="183.0" r="10.5" fill="#4c1d95"/><text x="86" y="186.6" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">1</text>
  <text x="104" y="188.0" fill="#fff" font-size="13" font-weight="700">Orchestration</text>
