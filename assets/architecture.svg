  <text x="64" y="45" font-size="21" font-weight="800" fill="#1e1633" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" letter-spacing="0.2">Architecture at a glance</text>
  <text x="838" y="42" text-anchor="end" font-size="12" font-weight="600" fill="#b29ddb" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">fireflyframework-agentic</text>
  <line x1="26" y1="62" x2="838" y2="62" stroke="#7c3aed" stroke-width="1.4" opacity="0.42"/>
  <text x="26" y="84" font-size="12.5" font-style="italic" fill="#8b82a3" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">One install, one decorator — five cohesive layers on the Pydantic AI engine.</text>
