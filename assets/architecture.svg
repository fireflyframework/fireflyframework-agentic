  <rect width="864" height="628" fill="#ffffff"/><rect x="3" y="3" width="858" height="622" rx="18" fill="#ffffff" stroke="#e4def5" stroke-width="1.5"/><rect x="3" y="3" width="858" height="622" rx="18" fill="url(#amb)"/>
