  <rect x="80" y="106" width="698" height="2" rx="1" fill="#fbf8ff" opacity="0.3"/>
  <text x="88" y="120" font-size="10.5" font-weight="800" fill="#1c0e3a" letter-spacing="1.4">THE FRONT DOOR</text>
  <text x="88" y="139" font-size="15" font-weight="800" fill="#190a35" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">pip install fireflyframework-agentic · @firefly_agent</text>
  <text x="776" y="120" text-anchor="end" font-size="11" fill="#1c0e3a" font-weight="700">one install</text>
  <text x="776" y="139" text-anchor="end" font-size="11" fill="#1c0e3a" font-weight="700">one decorator</text>
