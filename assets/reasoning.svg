<svg xmlns="http://www.w3.org/2000/svg" width="980" height="486" viewBox="0 0 980 486" role="img" aria-label="Firefly Agentic reasoning: a reason/act/observe loop feeding six pluggable patterns." font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241a3a"/><stop offset="1" stop-color="#150f26"/></linearGradient>
    <radialGradient id="amb" cx="150" cy="64" r="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.12"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="3.2" flood-color="#4c1d95" flood-opacity="0.16"/></filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.2" refY="3.2" orient="auto"><path d="M0 0L7 3.2L0 6.4Z" fill="#6d28d9"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="6.2" refY="3.2" orient="auto"><path d="M0 0L7 3.2L0 6.4Z" fill="#6366f1"/></marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="6.2" refY="3.2" orient="auto"><path d="M0 0L7 3.2L0 6.4Z" fill="#c2722a"/></marker>
    <g id="fly"><circle r="8.5" fill="#a78bfa" opacity="0.10"/><circle r="4.6" fill="#c4b5fd" opacity="0.22"/><circle r="2.4" fill="#ddd6fe" opacity="0.75"/><circle r="1.2" fill="#f5f3ff"/></g>
    <g id="ffly"><circle r="8.5" fill="#f6a821" opacity="0.10"/><circle r="4.6" fill="#ffc24a" opacity="0.22"/><circle r="2.4" fill="#ffd980" opacity="0.78"/><circle r="1.2" fill="#fff6e0"/></g>
  <radialGradient id="dot" cx="42%" cy="34%" r="72%"><stop offset="0" stop-color="#FFF9C1"/><stop offset="1" stop-color="#F68000"/></radialGradient></defs>
  <rect width="980" height="486" fill="#ffffff"/><rect x="3" y="3" width="974" height="480" rx="18" fill="#ffffff" stroke="#e4def5" stroke-width="1.5"/><rect x="3" y="3" width="974" height="480" rx="18" fill="url(#amb)"/>
  <g transform="translate(40,30) scale(1.25)"><circle r="11" fill="#f6a821" opacity="0.16"/><circle r="6.5" fill="#ffc24a" opacity="0.30"/><circle r="3.4" fill="url(#dot)"/><circle r="1.5" fill="#fff6e0"/></g>
  <text x="64" y="45" font-size="21" font-weight="800" fill="#1e1633" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" letter-spacing="0.2">Six reasoning patterns on one pluggable loop</text>
  <text x="954" y="42" text-anchor="end" font-size="12" font-weight="600" fill="#b29ddb" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">fireflyframework-agentic</text>
  <line x1="26" y1="62" x2="954" y2="62" stroke="#7c3aed" stroke-width="1.4" opacity="0.42"/>
  <text x="26" y="84" font-size="12.5" font-style="italic" fill="#8b82a3" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Every pattern fills the same template-method loop; ReasoningPipeline chains them and OutputReviewer validates.</text>
  <g filter="url(#sh)"><rect x="137.0" y="128" width="150" height="44" rx="10" fill="#f5f2fe" stroke="#7c3aed" stroke-width="1.8"/></g><text x="212.0" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">_reason</text>
  <line x1="287.0" y1="150.0" x2="309.0" y2="150.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr)"/>
  <g filter="url(#sh)"><rect x="309.0" y="128" width="150" height="44" rx="10" fill="#f5f2fe" stroke="#7c3aed" stroke-width="1.8"/></g><text x="384.0" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">_act</text>
  <line x1="459.0" y1="150.0" x2="481.0" y2="150.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr)"/>
  <g filter="url(#sh)"><rect x="481.0" y="128" width="150" height="44" rx="10" fill="#f5f2fe" stroke="#7c3aed" stroke-width="1.8"/></g><text x="556.0" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">_observe</text>
  <line x1="631.0" y1="150.0" x2="653.0" y2="150.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr)"/>
  <g filter="url(#sh)"><rect x="653.0" y="128" width="150" height="44" rx="10" fill="#f5f2fe" stroke="#7c3aed" stroke-width="1.8"/></g><text x="728.0" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">_should_continue</text>
  <path d="M728.0 172 C 728.0 212, 212.0 212, 212.0 174" fill="none" stroke="#c2722a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arra)"/>
  <rect x="349.1" y="220" width="281.8" height="19" rx="9.5" fill="#ffffff"/>
  <text x="490" y="233" text-anchor="middle" font-size="10.5" fill="#a85d22" font-weight="600">loops until done  -&gt;  ReasoningResult + ReasoningTrace</text>
  <g filter="url(#sh)"><rect x="26.0" y="246.0" width="300.0" height="92" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/><path d="M26.0 256a10 10 0 0 1 10 -10h280.0a10 10 0 0 1 10 10v13H26.0Z" fill="url(#hdr)"/></g><text x="38.0" y="261" font-size="11" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">ReAct</text><text x="38.0" y="285" font-size="10" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">observe -&gt; think -&gt; act</text><text x="38.0" y="300" font-size="10" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">interleaved tool use</text>
  <g filter="url(#sh)"><rect x="340.0" y="246.0" width="300.0" height="92" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/><path d="M340.0 256a10 10 0 0 1 10 -10h280.0a10 10 0 0 1 10 10v13H340.0Z" fill="url(#hdr)"/></g><text x="352.0" y="261" font-size="11" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Chain of Thought</text><text x="352.0" y="285" font-size="10" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">step-by-step reasoning</text><text x="352.0" y="300" font-size="10" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">explicit intermediate steps</text>
  <g filter="url(#sh)"><rect x="654.0" y="246.0" width="300.0" height="92" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/><path d="M654.0 256a10 10 0 0 1 10 -10h280.0a10 10 0 0 1 10 10v13H654.0Z" fill="url(#hdr)"/></g><text x="666.0" y="261" font-size="11" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Plan-and-Execute</text><text x="666.0" y="285" font-size="10" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">goal -&gt; plan -&gt; steps</text><text x="666.0" y="300" font-size="10" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">optional replanning</text>
  <g filter="url(#sh)"><rect x="26.0" y="352.0" width="300.0" height="92" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/><path d="M26.0 362a10 10 0 0 1 10 -10h280.0a10 10 0 0 1 10 10v13H26.0Z" fill="url(#hdr)"/></g><text x="38.0" y="367" font-size="11" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Reflexion</text><text x="38.0" y="391" font-size="10" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">execute -&gt; critique -&gt; retry</text><text x="38.0" y="406" font-size="10" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">self-correcting loop</text>
  <g filter="url(#sh)"><rect x="340.0" y="352.0" width="300.0" height="92" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/><path d="M340.0 362a10 10 0 0 1 10 -10h280.0a10 10 0 0 1 10 10v13H340.0Z" fill="url(#hdr)"/></g><text x="352.0" y="367" font-size="11" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Tree of Thoughts</text><text x="352.0" y="391" font-size="10" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">branch -&gt; evaluate -&gt; select</text><text x="352.0" y="406" font-size="10" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">search over thoughts</text>
  <g filter="url(#sh)"><rect x="654.0" y="352.0" width="300.0" height="92" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/><path d="M654.0 362a10 10 0 0 1 10 -10h280.0a10 10 0 0 1 10 10v13H654.0Z" fill="url(#hdr)"/></g><text x="666.0" y="367" font-size="11" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Goal Decomposition</text><text x="666.0" y="391" font-size="10" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">goal -&gt; phases -&gt; tasks</text><text x="666.0" y="406" font-size="10" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">hierarchical breakdown</text>
</svg>
