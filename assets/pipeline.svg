  <text x="124" y="44" font-size="20" font-weight="800" fill="#1e1633" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" letter-spacing="0.2">Pipelines: declarative graphs and explicit state</text>
  <text x="1074" y="22" text-anchor="end" font-size="10" font-weight="600" fill="#b29ddb" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">fireflyframework-agentic</text>
  <line x1="26" y1="62" x2="1074" y2="62" stroke="#7c3aed" stroke-width="1.4" opacity="0.42"/>
  <text x="26" y="84" font-size="14" fill="#756881" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Build a DAG for parallel stages, or enable cyclic routing for iterative work.</text>
<text x="42" y="124" font-size="14" font-weight="700" fill="#5b21b6" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">EXAMPLE: DOCUMENT PROCESSING DAG</text>
<g filter="url(#sh)"><rect x="42" y="151" width="328" height="108" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M42 163a12 12 0 0 1 12 -12h304a12 12 0 0 1 12 12v23H42Z" fill="url(#hdr)"/>
<text x="60" y="175" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Ingest and split</text>
<text x="60" y="208" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">BinaryNormalizer</text>
<text x="60" y="231" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">DocumentSplitter</text>
<g filter="url(#sh)"><rect x="386" y="151" width="328" height="108" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M386 163a12 12 0 0 1 12 -12h304a12 12 0 0 1 12 12v23H386Z" fill="url(#hdr)"/>
<text x="404" y="175" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Classify</text>
<text x="404" y="208" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">AgentStep</text>
<text x="404" y="231" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Typed document category</text>
<g filter="url(#sh)"><rect x="730" y="151" width="328" height="108" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M730 163a12 12 0 0 1 12 -12h304a12 12 0 0 1 12 12v23H730Z" fill="url(#hdr)"/>
<text x="748" y="175" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Extract in parallel</text>
<text x="748" y="208" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Send dispatches worker nodes</text>
<text x="748" y="231" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Reducers merge worker results</text>
<g filter="url(#sh)"><rect x="730" y="303" width="328" height="108" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M730 315a12 12 0 0 1 12 -12h304a12 12 0 0 1 12 12v23H730Z" fill="url(#hdr)"/>
<text x="748" y="327" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Validate</text>
<text x="748" y="360" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">OutputReviewer</text>
<text x="748" y="383" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Application validation rules</text>
<g filter="url(#sh)"><rect x="386" y="303" width="328" height="108" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M386 315a12 12 0 0 1 12 -12h304a12 12 0 0 1 12 12v23H386Z" fill="url(#hdr)"/>
<text x="404" y="327" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Assemble</text>
<text x="404" y="360" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Typed application output</text>
<text x="404" y="383" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Merge validated fields</text>
<g filter="url(#sh)"><rect x="42" y="303" width="328" height="108" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M42 315a12 12 0 0 1 12 -12h304a12 12 0 0 1 12 12v23H42Z" fill="url(#hdr)"/>
<text x="60" y="327" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Explain</text>
<text x="60" y="360" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">ReportBuilder</text>
<text x="60" y="383" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Build the processing report</text>
<line x1="371.0" y1="205.0" x2="384.0" y2="205.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="715.0" y1="205.0" x2="728.0" y2="205.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="894.0" y1="260.0" x2="894.0" y2="301.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="728.0" y1="357.0" x2="715.0" y2="357.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="384.0" y1="357.0" x2="371.0" y2="357.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr)"/>
<g filter="url(#sh)"><rect x="42" y="451" width="328" height="132" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M42 463a12 12 0 0 1 12 -12h304a12 12 0 0 1 12 12v23H42Z" fill="url(#door)"/>
<text x="60" y="475" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Control flow</text>
<text x="60" y="508" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Pause: wait for external input</text>
<text x="60" y="531" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Send: dispatch worker payloads</text>
<text x="60" y="554" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Cycles: opt in + visit limits</text>
<g filter="url(#sh)"><rect x="386" y="451" width="328" height="132" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M386 463a12 12 0 0 1 12 -12h304a12 12 0 0 1 12 12v23H386Z" fill="url(#door)"/>
<text x="404" y="475" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Checkpointing</text>
<text x="404" y="508" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Checkpointer / FileCheckpointer</text>
<text x="404" y="531" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Persist resumable run state</text>
<text x="404" y="554" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Resume from saved checkpoints</text>
<g filter="url(#sh)"><rect x="730" y="451" width="328" height="132" rx="12" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5"/></g>
<path d="M730 463a12 12 0 0 1 12 -12h304a12 12 0 0 1 12 12v23H730Z" fill="url(#door)"/>
<text x="748" y="475" font-size="16" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Audit and events</text>
<text x="748" y="508" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">AuditLog records node results</text>
<text x="748" y="531" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Event handlers observe progress</text>
<text x="748" y="554" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Wire the sinks your app needs</text>
<text x="550" y="624" font-size="15" font-weight="400" fill="#5b21b6" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">PipelineBuilder + PipelineEngine · per-node conditions, retries and timeouts</text>
<text x="550" y="655" font-size="14" font-weight="400" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">The flow above is one application design; these stages are not a required pipeline sequence.</text>
</svg>
