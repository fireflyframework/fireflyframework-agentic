  <g filter="url(#sh)"><rect x="520.0" y="312.0" width="360.0" height="52" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/><path d="M520.0 322a10 10 0 0 1 10 -10h340.0a10 10 0 0 1 10 10v13H520.0Z" fill="url(#door)"/></g><text x="532.0" y="327" font-size="11" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">AuditLog family</text><text x="532.0" y="351" font-size="10" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">File · Logging · Otel · Queryable (AuditEntry)</text>
  <text x="500" y="448" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8b82a3">PipelineBuilder.chain(...) wires the DAG · AgentStep · ReasoningStep · CallableStep · BranchStep · BatchLLMStep · EmbeddingStep · RetrievalStep</text>
