<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Firefly Agentic pipeline: a seven-phase IDP DAG with fan-out/fan-in, a human-in-the-loop pause, checkpointing and an audit log." font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
