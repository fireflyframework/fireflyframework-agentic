  <rect width="1100" height="690" fill="#ffffff"/><rect x="3" y="3" width="1094" height="684" rx="18" fill="#ffffff" stroke="#e4def5" stroke-width="1.5"/><rect x="3" y="3" width="1094" height="684" rx="18" fill="url(#grid)"/><rect x="3" y="3" width="1094" height="684" rx="18" fill="url(#amb)"/>
