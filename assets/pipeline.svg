<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="diagram-title diagram-description" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <title id="diagram-title">An example document-processing DAG ingests and splits, classifies, extracts in parallel, validates, assembles, and explains</title><desc id="diagram-description">An example document-processing DAG ingests and splits, classifies, extracts in parallel, validates, assembles, and explains. It illustrates an application composition rather than mandatory stages. PipelineBuilder and PipelineEngine also support explicitly enabled cycles with visit limits. Pause requests external input; Send dispatches worker payloads. Checkpointing and audit/event sinks are configurable.</desc>
