  <line x1="695.3" y1="191.0" x2="705.3" y2="191.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr)"/>
  <g filter="url(#sh)"><rect x="705.3" y="156.0" width="118.0" height="70" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/><path d="M705.3 166a10 10 0 0 1 10 -10h98.0a10 10 0 0 1 10 10v13H705.3Z" fill="url(#hdr)"/></g><text x="717.3" y="171" font-size="11" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">assemble</text><text x="717.3" y="195" font-size="10" fill="#322b45" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">FanInStep</text>
