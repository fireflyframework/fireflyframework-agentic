  <text x="64" y="45" font-size="21" font-weight="800" fill="#1e1633" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" letter-spacing="0.2">Pipelines — a typed DAG your agents run on</text>
  <text x="974" y="42" text-anchor="end" font-size="12" font-weight="600" fill="#b29ddb" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">fireflyframework-agentic</text>
