  <rect width="1000" height="470" fill="#ffffff"/><rect x="3" y="3" width="994" height="464" rx="18" fill="#ffffff" stroke="#e4def5" stroke-width="1.5"/><rect x="3" y="3" width="994" height="464" rx="18" fill="url(#amb)"/>
