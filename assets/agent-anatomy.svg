<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="Firefly Agentic agent anatomy: a FireflyAgent wrapping pydantic_ai.Agent inside a ten-stage middleware chain." font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241a3a"/><stop offset="1" stop-color="#150f26"/></linearGradient>
    <radialGradient id="amb" cx="840" cy="64" r="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.12"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="3.2" flood-color="#4c1d95" flood-opacity="0.16"/></filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.2" refY="3.2" orient="auto"><path d="M0 0L7 3.2L0 6.4Z" fill="#6d28d9"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="6.2" refY="3.2" orient="auto"><path d="M0 0L7 3.2L0 6.4Z" fill="#6366f1"/></marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="6.2" refY="3.2" orient="auto"><path d="M0 0L7 3.2L0 6.4Z" fill="#c2722a"/></marker>
    <g id="fly"><circle r="8.5" fill="#a78bfa" opacity="0.10"/><circle r="4.6" fill="#c4b5fd" opacity="0.22"/><circle r="2.4" fill="#ddd6fe" opacity="0.75"/><circle r="1.2" fill="#f5f3ff"/></g>
    <g id="ffly"><circle r="8.5" fill="#f6a821" opacity="0.10"/><circle r="4.6" fill="#ffc24a" opacity="0.22"/><circle r="2.4" fill="#ffd980" opacity="0.78"/><circle r="1.2" fill="#fff6e0"/></g>
  <radialGradient id="dot" cx="42%" cy="34%" r="72%"><stop offset="0" stop-color="#FFF9C1"/><stop offset="1" stop-color="#F68000"/></radialGradient></defs>
  <rect width="1000" height="500" fill="#ffffff"/><rect x="3" y="3" width="994" height="494" rx="18" fill="#ffffff" stroke="#e4def5" stroke-width="1.5"/><rect x="3" y="3" width="994" height="494" rx="18" fill="url(#amb)"/>
  <g transform="translate(40,30) scale(1.25)"><circle r="11" fill="#f6a821" opacity="0.16"/><circle r="6.5" fill="#ffc24a" opacity="0.30"/><circle r="3.4" fill="url(#dot)"/><circle r="1.5" fill="#fff6e0"/></g>
  <text x="64" y="45" font-size="21" font-weight="800" fill="#1e1633" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" letter-spacing="0.2">Anatomy of an agent run — middleware all the way down</text>
  <text x="974" y="42" text-anchor="end" font-size="12" font-weight="600" fill="#b29ddb" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">fireflyframework-agentic</text>
  <line x1="26" y1="62" x2="974" y2="62" stroke="#7c3aed" stroke-width="1.4" opacity="0.42"/>
  <text x="26" y="84" font-size="12.5" font-style="italic" fill="#8b82a3" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">FireflyAgent wraps pydantic_ai.Agent; a composable MiddlewareChain wraps every run.</text>
  <text x="500" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6" letter-spacing="0.06em">MiddlewareChain — wraps every agent.run()</text>
  <g filter="url(#sh)"><rect x="40.0" y="170" width="176" height="46" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="40.0" y="170" width="6" height="46" rx="3" fill="url(#hdr)"/></g>
  <text x="58.0" y="198" font-size="11" font-weight="600" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Logging</text>
  <g filter="url(#sh)"><rect x="226.0" y="170" width="176" height="46" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="226.0" y="170" width="6" height="46" rx="3" fill="url(#hdr)"/></g>
  <text x="244.0" y="198" font-size="11" font-weight="600" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Observability</text>
  <g filter="url(#sh)"><rect x="412.0" y="170" width="176" height="46" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="412.0" y="170" width="6" height="46" rx="3" fill="url(#hdr)"/></g>
  <text x="430.0" y="198" font-size="11" font-weight="600" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">PromptGuard</text>
  <g filter="url(#sh)"><rect x="598.0" y="170" width="176" height="46" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="598.0" y="170" width="6" height="46" rx="3" fill="url(#hdr)"/></g>
  <text x="616.0" y="198" font-size="11" font-weight="600" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">OutputGuard</text>
  <g filter="url(#sh)"><rect x="784.0" y="170" width="176" height="46" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="784.0" y="170" width="6" height="46" rx="3" fill="url(#hdr)"/></g>
  <text x="802.0" y="198" font-size="11" font-weight="600" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">CostGuard</text>
  <g filter="url(#sh)"><rect x="40.0" y="228" width="176" height="46" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="40.0" y="228" width="6" height="46" rx="3" fill="url(#hdr)"/></g>
  <text x="58.0" y="256" font-size="11" font-weight="600" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Cache</text>
  <g filter="url(#sh)"><rect x="226.0" y="228" width="176" height="46" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="226.0" y="228" width="6" height="46" rx="3" fill="url(#hdr)"/></g>
  <text x="244.0" y="256" font-size="11" font-weight="600" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">PromptCache</text>
  <g filter="url(#sh)"><rect x="412.0" y="228" width="176" height="46" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="412.0" y="228" width="6" height="46" rx="3" fill="url(#hdr)"/></g>
  <text x="430.0" y="256" font-size="11" font-weight="600" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Explainability</text>
  <g filter="url(#sh)"><rect x="598.0" y="228" width="176" height="46" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="598.0" y="228" width="6" height="46" rx="3" fill="url(#hdr)"/></g>
  <text x="616.0" y="256" font-size="11" font-weight="600" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Validation</text>
  <g filter="url(#sh)"><rect x="784.0" y="228" width="176" height="46" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="784.0" y="228" width="6" height="46" rx="3" fill="url(#hdr)"/></g>
  <text x="802.0" y="256" font-size="11" font-weight="600" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Retry / CircuitBreaker</text>
  <g filter="url(#sh)"><rect x="290.0" y="294" width="420" height="58" rx="11" fill="url(#bed)"/></g>
  <g transform="translate(320.0,323) scale(1.2)"><circle r="11" fill="#f6a821" opacity="0.16"/><circle r="6.5" fill="#ffc24a" opacity="0.30"/><circle r="3.4" fill="url(#dot)"/><circle r="1.5" fill="#fff6e0"/></g>
  <text x="344.0" y="319" font-size="13" font-weight="800" fill="#efe8ff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">FireflyAgent  -&gt;  pydantic_ai.Agent</text>
  <text x="344.0" y="337" font-size="10.5" fill="#c3b6e6">the model call — tools, structured output, streaming</text>
  <line x1="500.0" y1="282.0" x2="500.0" y2="292.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr)"/>
  <g filter="url(#sh)"><rect x="30.0" y="380.0" width="300.0" height="52" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/><path d="M30.0 390a10 10 0 0 1 10 -10h280.0a10 10 0 0 1 10 10v13H30.0Z" fill="url(#door)"/></g><text x="42.0" y="395" font-size="11" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">DelegationRouter</text><text x="42.0" y="419" font-size="10" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">7 strategies route across an agent pool</text>
  <g filter="url(#sh)"><rect x="350.0" y="380.0" width="300.0" height="52" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/><path d="M350.0 390a10 10 0 0 1 10 -10h280.0a10 10 0 0 1 10 10v13H350.0Z" fill="url(#door)"/></g><text x="362.0" y="395" font-size="11" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">FallbackModelWrapper · ResultCache</text><text x="362.0" y="419" font-size="10" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">automatic failover + response caching</text>
  <g filter="url(#sh)"><rect x="670.0" y="380.0" width="300.0" height="52" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/><path d="M670.0 390a10 10 0 0 1 10 -10h280.0a10 10 0 0 1 10 10v13H670.0Z" fill="url(#door)"/></g><text x="682.0" y="395" font-size="11" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">MemoryManager · AgentLifecycle</text><text x="682.0" y="419" font-size="10" fill="#322b45" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">conversation + working memory · hooks</text>
</svg>
